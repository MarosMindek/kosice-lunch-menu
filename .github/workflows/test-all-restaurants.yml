name: Live all restaurants scraper

# Superseded by daily-lunch.yml; retained for explicit diagnostics only.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run scrape:all
      - uses: actions/upload-artifact@v4
        with:
          name: all-restaurants-output
          path: output/all-restaurants/
          if-no-files-found: error
      - name: Publish latest text/JSON results
        shell: bash
        run: |
          rm -rf results/all-restaurants
          mkdir -p results/all-restaurants
          find output/all-restaurants -maxdepth 1 -type f \( -name '*.json' -o -name '*.txt' \) -exec cp {} results/all-restaurants/ \;
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/all-restaurants
          git commit -m "Update live restaurant data [skip ci]" || exit 0
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push; then exit 0; fi
          done
          exit 1

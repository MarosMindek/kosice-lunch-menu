name: Autonomous lunch email

on:
  push:
    branches: [main]
    paths: ['scripts/**', 'templates/**', 'test/**', 'package.json', '.github/workflows/daily-lunch.yml']
  workflow_dispatch:
    inputs:
      send:
        description: 'Send the validated email (false runs a live preview only)'
        type: boolean
        default: false
  schedule:
    - cron: '30,45 9 * * 1-5'
      timezone: 'Europe/Bratislava'
    - cron: '0 10 * * 1-5'
      timezone: 'Europe/Bratislava'

concurrency:
  group: ${{ (github.event_name == 'schedule' || inputs.send == true) && 'autonomous-lunch-delivery' || 'autonomous-lunch-preview' }}
  cancel-in-progress: ${{ github.event_name != 'schedule' && inputs.send != true }}

permissions:
  contents: write

jobs:
  lunch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SEND_EMAIL: ${{ github.event_name == 'schedule' || inputs.send == true }}
      GMAIL_OAUTH_JSON: ${{ secrets.GMAIL_OAUTH_JSON }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Skip non-working days and already delivered mail before installing browsers
        id: preflight
        run: node scripts/preflight.mjs
      - name: Regression tests
        if: steps.preflight.outputs.skip != 'true'
        run: npm test
      - name: Install pinned Node dependencies
        if: steps.preflight.outputs.skip != 'true'
        timeout-minutes: 3
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Install Chromium and browser system dependencies
        if: steps.preflight.outputs.skip != 'true'
        timeout-minutes: 6
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: '30000'
        run: npx playwright install --with-deps chromium
      - name: Install PDF and OCR dependencies
        if: steps.preflight.outputs.skip != 'true'
        timeout-minutes: 3
        run: |
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update -qq
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y -qq poppler-utils tesseract-ocr tesseract-ocr-slk python3-pil
      - name: Collect, validate, render and optionally deliver
        if: steps.preflight.outputs.skip != 'true'
        run: |
          if [ "$SEND_EMAIL" = "true" ]; then
            npm run lunch:send
          else
            npm run lunch:dry-run
          fi
      - name: Save diagnostics and exact rendered preview
        if: always() && steps.preflight.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: lunch-${{ github.run_id }}
          path: |
            output/autonomous/
            output/bluebell-hires/
          retention-days: 7
          if-no-files-found: ignore

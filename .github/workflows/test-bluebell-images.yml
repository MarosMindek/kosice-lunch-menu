name: Test BlueBell image capture

on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/bluebell-images.mjs'
      - 'package.json'
      - '.github/workflows/test-bluebell-images.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run scrape:bluebell-images
      - name: OCR recent BlueBell posts and photo thumbnails
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-slk
          mkdir -p output/bluebell-images/ocr
          shopt -s nullglob
          for f in output/bluebell-images/post-*.png output/bluebell-images/thumb-*.png; do
            b=$(basename "$f" .png)
            tesseract "$f" "output/bluebell-images/ocr/$b" -l slk+eng --psm 6 2>/dev/null || true
          done
          cat output/bluebell-images/ocr/*.txt > output/bluebell-images/ocr-all.txt || true
      - uses: actions/upload-artifact@v4
        with:
          name: bluebell-images-output
          path: output/bluebell-images/
          if-no-files-found: error
      - name: Publish latest capture to repository
        run: |
          rm -rf results/bluebell-images
          mkdir -p results
          cp -R output/bluebell-images results/bluebell-images
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/bluebell-images
          git commit -m "Update BlueBell image capture [skip ci]" || exit 0
          git push

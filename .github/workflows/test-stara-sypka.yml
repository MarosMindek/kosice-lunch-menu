name: Live Stara Sypka PDF scraper

on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/stara-sypka.mjs'
      - 'package.json'
      - '.github/workflows/test-stara-sypka.yml'
  workflow_dispatch:
  schedule:
    # Refresh before the 09:30, 09:45 and 10:00 Europe/Bratislava mail gates.
    - cron: '15,35,50 7,8 * * 1-5'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: npm run scrape:stara-sypka
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stara-sypka-output
          path: output/stara-sypka/
          if-no-files-found: warn
      - name: Publish latest text and JSON
        if: always()
        shell: bash
        run: |
          if [ -d output/stara-sypka ]; then
            rm -rf results/stara-sypka
            mkdir -p results/stara-sypka
            find output/stara-sypka -maxdepth 1 -type f \( -name '*.json' -o -name '*.txt' \) -exec cp {} results/stara-sypka/ \;
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add results/stara-sypka
            git commit -m "Update Stara Sypka live PDF data [skip ci]" || exit 0
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push; then exit 0; fi
            done
            exit 1
          fi


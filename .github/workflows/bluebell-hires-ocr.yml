name: BlueBell hi-res OCR

# Superseded by daily-lunch.yml; retained for explicit diagnostics only.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run scrape:bluebell-hires
      - name: OCR hi-res images
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-slk
          mkdir -p output/bluebell-hires/ocr
          shopt -s nullglob
          for f in output/bluebell-hires/gallery-*; do
            [ -f "$f" ] || continue
            b=$(basename "$f"); b=${b%.*}
            for psm in 6 11; do
              tesseract "$f" "output/bluebell-hires/ocr/${b}-psm${psm}" -l slk+eng --psm "$psm" 2>/dev/null || true
            done
          done
      - name: Select dated menu images independently
        run: node scripts/bluebell-select.mjs output/bluebell-hires
      - uses: actions/upload-artifact@v4
        with:
          name: bluebell-hires-output
          path: output/bluebell-hires/
          retention-days: 7
      - name: Publish hi-res OCR
        run: |
          rm -rf results/bluebell-hires
          mkdir -p results
          cp -R output/bluebell-hires results/bluebell-hires
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/bluebell-hires
          git commit -m "Update BlueBell hi-res OCR [skip ci]" || exit 0
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push; then exit 0; fi
          done
          exit 1

name: BlueBell hi-res OCR

on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/bluebell-hires.mjs'
      - 'package.json'
      - '.github/workflows/bluebell-hires-ocr.yml'
  workflow_dispatch:
  schedule:
    # Fresh hi-res OCR after the regular BlueBell capture, before the first mail gate.
    - cron: '10 7,8 * * 1-5'

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Local-time gate
        id: gate
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "schedule" ] || [ "$(TZ=Europe/Bratislava date +%H)" = "09" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: '22'
      - run: npm install
        if: steps.gate.outputs.run == 'true'
      - run: npx playwright install --with-deps chromium
        if: steps.gate.outputs.run == 'true'
      - run: npm run scrape:bluebell-hires
        if: steps.gate.outputs.run == 'true'
      - name: OCR hi-res images
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr
          mkdir -p output/bluebell-hires/ocr
          shopt -s nullglob
          for f in output/bluebell-hires/gallery-*; do
            [ -f "$f" ] || continue
            b=$(basename "$f"); b=${b%.*}
            for psm in 6 11; do
              tesseract "$f" "output/bluebell-hires/ocr/${b}-psm${psm}" -l eng --psm "$psm" 2>/dev/null || true
            done
          done
          cat output/bluebell-hires/ocr/*.txt > output/bluebell-hires/ocr-all.txt || true
      - name: Publish hi-res OCR
        if: steps.gate.outputs.run == 'true'
        run: |
          rm -rf results/bluebell-hires
          mkdir -p results
          cp -R output/bluebell-hires results/bluebell-hires
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/bluebell-hires
          git commit -m "Update BlueBell hi-res OCR [skip ci]" || exit 0
          git pull --rebase origin main
          git push

name: BlueBell hi-res OCR

on:
  push:
    branches: [main]
    paths:
      - 'scripts/bluebell-hires.mjs'
      - 'scripts/bluebell-select.mjs'
      - 'scripts/lib/bluebell-auto.mjs'
      - 'scripts/lib/facebook-images.mjs'
      - '.github/workflows/bluebell-hires-ocr.yml'
  workflow_dispatch:
  # GitHub cron is UTC. Schedule both CET/CEST candidate hours and keep only
  # 09:00-10:00 Europe/Bratislava below. This gives fresh captures before the
  # 09:30, 09:45 and 10:00 lunch-email attempts throughout the year.
  schedule:
    - cron: '10,40,55 7,8 * * 1-5'

concurrency:
  group: bluebell-hires-ocr-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Local schedule guard
        id: guard
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          local_hm=$(TZ=Europe/Bratislava date +%H%M)
          if [ "$local_hm" -ge 0900 ] && [ "$local_hm" -le 1000 ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.guard.outputs.skip != 'true'
      - uses: actions/setup-node@v4
        if: steps.guard.outputs.skip != 'true'
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
        if: steps.guard.outputs.skip != 'true'
      - run: npx playwright install --with-deps chromium
        if: steps.guard.outputs.skip != 'true'
      - run: npm run scrape:bluebell-hires
        if: steps.guard.outputs.skip != 'true'
      - name: OCR hi-res images
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-slk python3-pil
          mkdir -p output/bluebell-hires/ocr
          shopt -s nullglob
          for f in output/bluebell-hires/gallery-*; do
            [ -f "$f" ] || continue
            b=$(basename "$f"); b=${b%.*}
            for psm in 6 11; do
              tesseract "$f" "output/bluebell-hires/ocr/${b}-psm${psm}" -l slk+eng --psm "$psm" 2>/dev/null || true
            done
          done
      - name: Select dated menu images independently
        if: steps.guard.outputs.skip != 'true'
        run: node scripts/bluebell-select.mjs output/bluebell-hires
      - name: Publish strict machine-validated menu when OCR agrees
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { collectBluebell } from './scripts/lib/bluebell-auto.mjs';
          import { localDate } from './scripts/lib/menu-contract.mjs';
          const file='output/bluebell-hires/validated.json';
          const errorFile='output/bluebell-hires/validation-error.json';
          fs.rmSync(file,{force:true}); fs.rmSync(errorFile,{force:true});
          try {
            const menu=collectBluebell('output/bluebell-hires',localDate());
            fs.writeFileSync(file,JSON.stringify(menu,null,2));
            console.log(JSON.stringify({status:'validated',validFrom:menu.source.validFrom,validTo:menu.source.validTo,mains:menu.mains.length,soups:menu.soups.length,validation:menu.validation||menu.source.verification}));
          } catch (error) {
            fs.writeFileSync(errorFile,JSON.stringify({date:localDate(),capturedAt:new Date().toISOString(),error:error.message},null,2));
            console.log(JSON.stringify({status:'not_validated',error:error.message}));
          }
          NODE
      - uses: actions/upload-artifact@v4
        if: steps.guard.outputs.skip != 'true'
        with:
          name: bluebell-hires-output-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/bluebell-hires/
          retention-days: 7
      - name: Publish hi-res OCR
        if: steps.guard.outputs.skip != 'true'
        run: |
          rm -rf results/bluebell-hires
          mkdir -p results
          cp -R output/bluebell-hires results/bluebell-hires
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/bluebell-hires
          git commit -m "Update BlueBell hi-res OCR [skip ci]" || exit 0
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push; then exit 0; fi
          done
          exit 1
